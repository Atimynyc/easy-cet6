<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六级碎片化刷题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D4E89'/%3E%3Cpath d='M8 22V10l4 4 4-4v12' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#17233D; --ink2:#5B6B83; --ink3:#94A2B6;
  --primary:#1D4E89; --primary-d:#16406F; --primary-soft:#E7EFFA;
  --accent:#D97706; --accent-soft:#FDF3E3;
  --correct:#1E8E5A; --correct-soft:#E6F4EC;
  --wrong:#C8433B; --wrong-soft:#FBEBEA;
  --line:#DCE3EC; --line-2:#EEF1F6;
  --radius:12px; --radius-s:8px;
  --shadow:0 1px 2px rgba(23,35,61,.05), 0 4px 12px rgba(23,35,61,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#DFE5ED; color:var(--ink); font-size:15px; line-height:1.55;
}
.phone{
  position:relative; max-width:420px; margin:0 auto; height:100vh; height:100dvh;
  background:var(--bg); overflow:hidden; box-shadow:0 0 0 1px #CDD5E0;
}
@media(min-width:520px){ .phone{border-radius:24px; margin:20px auto; height:calc(100vh - 40px); box-shadow:0 12px 40px rgba(23,35,61,.18);} }

/* ===== 通用 ===== */
.view{display:none; position:absolute; inset:0; overflow-y:auto; padding-bottom:64px; background:var(--bg);}
.view.active{display:block}
.overlay{display:none; position:absolute; inset:0; z-index:40; background:var(--bg); flex-direction:column;}
.overlay.active{display:flex}
.hidden{display:none!important}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px;
  padding:14px 16px 10px; background:var(--bg);
}
.topbar .title{font-size:17px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .sub{font-size:12px; color:var(--ink2); font-weight:500;}
.icon-btn{
  width:36px; height:36px; border:none; background:var(--surface); color:var(--ink);
  border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:var(--shadow); flex:none;
}
.icon-btn:active{transform:scale(.94)}
.pad{padding:0 16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; cursor:pointer;
  font-size:15px; font-weight:600; border-radius:var(--radius-s); padding:12px 16px; font-family:inherit;
  transition:transform .08s ease, opacity .15s ease;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn-primary{background:var(--primary); color:#fff}
.btn-primary:not(:disabled):active{background:var(--primary-d)}
.btn-accent{background:var(--accent); color:#fff}
.btn-ghost{background:var(--surface); color:var(--primary); border:1px solid #C6D4E8}
.btn-danger{background:var(--wrong); color:#fff}
.btn-block{width:100%}
.btn-lg{padding:14px 20px; font-size:16px; border-radius:12px}
.chip{
  display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:999px;
  font-size:12px; font-weight:600; background:var(--primary-soft); color:var(--primary);
}
.chip.amber{background:var(--accent-soft); color:var(--accent)}
.chip.gray{background:#EDF1F6; color:var(--ink2)}
.chip.green{background:var(--correct-soft); color:var(--correct)}
.chip.red{background:var(--wrong-soft); color:var(--wrong)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .bold{font-weight:700}
.row{display:flex; align-items:center; gap:8px}
.spacer{flex:1}
hr.sep{border:none; border-top:1px solid var(--line-2); margin:0}

/* ===== 底部 Tab ===== */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; z-index:30; display:flex;
  background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 7px;
  border:none; background:none; cursor:pointer; color:var(--ink3); font-size:11px; font-family:inherit;
}
.tab svg{width:22px; height:22px}
.tab.active{color:var(--primary); font-weight:600}
.tab:active{opacity:.7}

/* ===== 今日页 ===== */
.hero{padding:18px 16px 14px; background:var(--surface); border-bottom:1px solid var(--line-2);}
.hero-top{display:flex; align-items:center; gap:12px;}
.progress-ring{flex:none; position:relative; width:74px; height:74px;}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .ring-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.progress-ring .ring-num b{font-size:18px; line-height:1.1}
.progress-ring .ring-num span{font-size:10px; color:var(--ink3)}
.hero-greet{flex:1}
.hero-greet h1{font-size:19px; font-weight:800; letter-spacing:.2px}
.hero-greet p{font-size:12.5px; color:var(--ink2); margin-top:2px}
.streak{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px;}
.streak svg{width:13px; height:13px}
.start-btn{margin:14px 0 4px; position:relative; overflow:hidden}
.start-btn small{display:block; font-size:12px; font-weight:500; opacity:.85; margin-top:2px}
.sec-title{display:flex; align-items:center; gap:6px; margin:16px 16px 8px; font-size:14px; font-weight:700;}
.sec-title .more{margin-left:auto; font-size:12px; color:var(--primary); font-weight:600; cursor:pointer; border:none; background:none; font-family:inherit}
.queue-item{
  display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); margin:0 16px 8px; cursor:pointer; box-shadow:var(--shadow);
}
.queue-item:active{transform:scale(.985)}
.queue-item .q-ico{width:38px; height:38px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none;}
.queue-item .q-ico svg{width:20px; height:20px}
.queue-item .q-main{flex:1; min-width:0}
.queue-item .q-title{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.queue-item .q-meta{font-size:11.5px; color:var(--ink3); margin-top:1px}
.queue-item .q-tag{flex:none}
.exam-entry{
  margin:4px 16px 0; padding:12px 14px; background:linear-gradient(135deg,#1D4E89,#2C6BB5);
  border:none; border-radius:var(--radius); color:#fff; display:flex; align-items:center; gap:10px; cursor:pointer; box-shadow:0 4px 14px rgba(29,78,137,.28);
}
.exam-entry:active{transform:scale(.985)}
.exam-entry .e-ico{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:none;}
.exam-entry .e-ico svg{width:19px; height:19px}
.exam-entry .e-main{flex:1}
.exam-entry .e-title{font-size:14px; font-weight:700}
.exam-entry .e-meta{font-size:11.5px; opacity:.82; margin-top:1px}
.exam-entry.locked{background:linear-gradient(135deg,#5B6B83,#7A8AA0); box-shadow:none}

/* ===== 学习页 ===== */
.learn-head{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line-2); padding:10px 16px;}
.learn-prog{display:flex; align-items:center; gap:10px; margin-top:8px;}
.prog-track{flex:1; height:6px; background:var(--line-2); border-radius:999px; overflow:hidden;}
.prog-track i{display:block; height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease}
.learn-timer{margin-left:auto; font-size:12.5px; font-weight:700; color:var(--ink2); display:flex; align-items:center; gap:4px}
.learn-timer svg{width:14px; height:14px}
.learn-body{flex:1; overflow-y:auto; padding:14px 16px 110px;}
.q-source{font-size:12px; color:var(--ink3); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.q-source .dot{width:4px; height:4px; border-radius:50%; background:var(--ink3)}
.q-stem{font-size:16px; font-weight:700; line-height:1.6; margin-bottom:14px; white-space:pre-line}
.q-passage{font-size:14px; color:var(--ink2); line-height:1.75; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px;}
.q-passage .hl{background:#FFF2D9; border-radius:3px; padding:0 2px}
w{display:inline; cursor:pointer; border-bottom:1.5px dotted #A9B8CC; padding:0 1px; border-radius:3px; transition:background .12s, color .12s;}
w:hover{background:#EAF1FF; color:#1D4E89;}
w.hlw{background:#FFF2D9; border-bottom-color:#E5B94C;}
#word-mask{position:fixed; inset:0; z-index:130; background:rgba(10,25,50,.45); display:none; align-items:flex-end; justify-content:center;}
#word-mask.open{display:flex;}
#word-sheet{width:100%; max-width:560px; background:var(--surface,#fff); border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(10,30,60,.18); animation:sheetUp .22s cubic-bezier(.2,.8,.3,1); max-height:74vh; overflow:auto;}
@keyframes sheetUp{from{transform:translateY(24px); opacity:.4} to{transform:none; opacity:1}}
.wd-word{font-size:22px; font-weight:800; color:var(--ink1,#16233B); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.wd-word .ph{font-size:14px; font-weight:600; color:var(--ink3,#8494AB); letter-spacing:.3px;}
.wd-sound{display:flex; gap:10px; margin:14px 0 4px;}
.wd-sound button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line-2,#E3E9F2); background:#F7FAFF; border-radius:12px; padding:10px; font-size:13px; font-weight:600; color:var(--ink2,#3D4C66); cursor:pointer;}
.wd-sound button:active{background:#EAF1FF;}
.wd-defs{margin-top:10px;}
.wd-def{display:flex; gap:8px; padding:9px 0; border-top:1px solid var(--line,#EDF1F7); font-size:14px; line-height:1.55;}
.wd-def .pt{color:var(--primary,#1D4E89); font-weight:700; min-width:34px;}
.wd-def .dm{color:var(--ink2,#3D4C66);}
.wd-foot{display:flex; gap:10px; margin-top:14px;}
.wd-foot button{flex:1; padding:11px; border-radius:12px; font-size:13.5px; font-weight:700;}
.wd-collect{border:1px solid var(--line-2,#E3E9F2); background:#fff; color:var(--ink2,#3D4C66); cursor:pointer;}
.wd-collect.done{color:#C8790B; border-color:#F3D9A4; background:#FFF9EE;}
.wd-close{background:var(--primary,#1D4E89); color:#fff; border:none; cursor:pointer;}
.wd-miss{font-size:12px; color:var(--ink3,#8494AB); margin-top:10px; line-height:1.6;}
.opt{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; cursor:pointer;
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:9px; font-size:15px; font-family:inherit; color:var(--ink); line-height:1.5;
}
.opt .opt-key{flex:none; width:24px; height:24px; border-radius:7px; background:var(--bg); color:var(--ink2); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.opt.selected{border-color:var(--primary); background:var(--primary-soft)}
.opt.selected .opt-key{background:var(--primary); color:#fff}
.opt.correct{border-color:var(--correct); background:var(--correct-soft)}
.opt.correct .opt-key{background:var(--correct); color:#fff}
.opt.wrong{border-color:var(--wrong); background:var(--wrong-soft)}
.opt.wrong .opt-key{background:var(--wrong); color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--primary); border-radius:var(--radius); padding:12px 14px; animation:pop .2s ease;}
.explain .x-head{font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:6px}
.explain .x-head .ans{color:var(--correct)}
.explain .x-head .ans.wrong{color:var(--wrong)}
.explain p{font-size:13.5px; color:var(--ink2); line-height:1.7}
.explain .word-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.explain .word-row .w{font-size:13px; font-weight:700}
.explain .word-row .d{font-size:12px; color:var(--ink3)}
@keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.learn-foot{
  position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--line);
}
.learn-foot .btn{flex:1}
.done-hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 24px 0;}
.done-hero .dh-ring{width:96px; height:96px; margin-bottom:16px}
.done-hero h2{font-size:20px; font-weight:800; margin-bottom:6px}
.done-hero p{font-size:13.5px; color:var(--ink2); line-height:1.7}

/* ===== 考试页 ===== */
.exam-timer{display:flex; align-items:center; gap:6px; font-weight:800; font-variant-numeric:tabular-nums;}
.exam-timer svg{width:15px; height:15px}
.exam-timer.warn{color:var(--wrong)}
.exam-timer.over{color:var(--wrong)}
.exam-timer .over-badge{font-size:10px; background:var(--wrong); color:#fff; border-radius:4px; padding:1px 5px; font-weight:700}
.audio-bar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:14px;}
.audio-bar .play{width:36px; height:36px; border-radius:50%; background:var(--primary); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.audio-bar .play svg{width:16px; height:16px}
.audio-bar .wave{flex:1; height:24px; position:relative;}
.audio-bar .wave .wbar{position:absolute; bottom:0; width:3px; border-radius:2px; background:#C9D6E8;}
.audio-bar .wave .wbar.done{background:var(--primary)}
.audio-bar .atime{font-size:11.5px; color:var(--ink3); font-variant-numeric:tabular-nums; flex:none}
.audio-notice{font-size:13px; color:var(--ink2); background:#F4F7FB; border:1px dashed var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; line-height:1.6;}
.audio-bar.real audio{display:none}
.type-hint{font-size:12px; color:var(--ink3); margin:-4px 0 12px; line-height:1.55;}
.q-passage .blank-cur{background:#FFE8A3; color:#8A5A00; font-weight:700; border-radius:3px; padding:0 3px;}
.word-bank{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
.opt.bank{flex:0 1 calc(50% - 4px); padding:10px 12px; font-size:13.5px;}
.opt.bank .opt-key{display:none}
.draft-area{width:100%; min-height:160px; resize:vertical; font-size:14.5px; line-height:1.7; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink1); font-family:inherit; box-sizing:border-box; margin-bottom:12px;}
.draft-area:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(29,78,137,.12)}
.draft-area[readonly]{background:#F7F9FC; color:var(--ink2)}

.answer-sheet{
  position:absolute; inset:0; z-index:45; background:var(--bg); transform:translateX(100%); transition:transform .25s ease;
  display:flex; flex-direction:column; border-left:1px solid var(--line);
}
.answer-sheet.open{transform:none}
.as-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:8px 16px 20px;}
.as-cell{
  aspect-ratio:1; border-radius:10px; background:var(--surface); border:1.5px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:12px; color:var(--ink2);
}
.as-cell b{font-size:16px; color:var(--ink)}
.as-cell.done{border-color:var(--correct); background:var(--correct-soft)}
.as-cell.done b{color:var(--correct)}
.as-cell.current{border-color:var(--primary); background:var(--primary-soft)}
.as-cell.current b{color:var(--primary)}
.as-cell.marked{border-style:dashed}
.result-hero{padding:26px 16px 0; text-align:center;}
.result-hero .score{font-size:44px; font-weight:900; letter-spacing:-1px; line-height:1.1}
.result-hero .score small{font-size:15px; font-weight:700; color:var(--ink3)}
.result-hero .tagline{font-size:13px; color:var(--ink2); margin-top:6px}
.kpi-row{display:flex; gap:8px; margin:18px 16px 0;}
.kpi{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 8px; text-align:center;}
.kpi b{display:block; font-size:17px; font-weight:800}
.kpi span{font-size:11px; color:var(--ink3)}
.err-list{margin:16px 16px 0;}
.err-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; cursor:pointer;}
.err-item:active{transform:scale(.985)}
.err-item .e-no{width:28px; height:28px; border-radius:8px; background:var(--wrong-soft); color:var(--wrong); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex:none}
.err-item .e-t{flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ===== 题库页 ===== */
.year-chips{display:flex; gap:8px; padding:6px 16px 12px; overflow-x:auto; scrollbar-width:none;}
.year-chips::-webkit-scrollbar{display:none}
.year-chip{flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink2); cursor:pointer; font-family:inherit;}
.year-chip.active{background:var(--primary); color:#fff; border-color:var(--primary)}
.section-card{margin:0 16px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.section-head{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; border:none; background:none; width:100%; text-align:left; font-family:inherit; color:var(--ink);}
.section-head .s-ico{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none;}
.section-head .s-ico svg{width:19px; height:19px}
.section-head .s-main{flex:1; min-width:0}
.section-head .s-name{font-size:14.5px; font-weight:700}
.section-head .s-meta{font-size:11.5px; color:var(--ink3); margin-top:1px}
.section-head .s-arrow{color:var(--ink3); transition:transform .2s}
.section-head .s-arrow.open{transform:rotate(180deg)}
.unit-row{display:flex; align-items:center; gap:10px; padding:11px 14px 11px 60px; border-top:1px solid var(--line-2); cursor:pointer;}
.unit-row:active{background:var(--bg)}
.unit-row .u-name{flex:1; font-size:13.5px; font-weight:600}
.unit-row .u-prog{font-size:11.5px; color:var(--ink3)}
.unit-row .u-lock{color:var(--ink3)}
.unit-row .u-go{color:var(--primary); font-size:12px; font-weight:700; display:flex; align-items:center; gap:2px}
.mini-bar{width:52px; height:5px; background:var(--line-2); border-radius:999px; overflow:hidden; flex:none}
.mini-bar i{display:block; height:100%; background:var(--primary); border-radius:999px}

/* ===== 统计页 ===== */
.stats-hero{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px 16px 0;}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow);}
.stat-card b{display:block; font-size:20px; font-weight:900; line-height:1.2}
.stat-card b small{font-size:12px; font-weight:700; color:var(--ink3)}
.stat-card span{font-size:11.5px; color:var(--ink3)}
.dim-tabs{display:flex; gap:6px; padding:14px 16px 4px;}
.dim-tab{flex:1; padding:8px 0; border-radius:10px; border:none; background:var(--surface); color:var(--ink2); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; border:1px solid var(--line);}
.dim-tab.active{background:var(--primary); color:#fff; border-color:var(--primary)}
.chart-card{margin:12px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
.chart-card .c-title{font-size:13.5px; font-weight:700; margin-bottom:4px}
.chart-card .c-sub{font-size:11.5px; color:var(--ink3); margin-bottom:10px}
.legend{display:flex; gap:12px; font-size:11.5px; color:var(--ink2); margin-bottom:8px}
.legend i{display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:4px; vertical-align:1px}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.bar-row .b-label{width:64px; flex:none; color:var(--ink2); font-weight:600}
.bar-row .b-track{flex:1; height:18px; background:var(--line-2); border-radius:6px; overflow:hidden; position:relative}
.bar-row .b-fill{height:100%; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; font-size:10.5px; font-weight:800; color:#fff; min-width:20px}
.speed-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed var(--line-2); font-size:13px;}
.speed-row:last-child{border-bottom:none}
.speed-row .s-name{flex:1; font-weight:600}
.speed-row .s-val{font-variant-numeric:tabular-nums; font-weight:700}
.speed-row .s-val.ok{color:var(--correct)}
.speed-row .s-val.slow{color:var(--wrong)}
.unit-stats{font-size:12.5px; color:var(--ink2);}
.unit-stats .u-row{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px dashed var(--line-2);}
.unit-stats .u-row:last-child{border-bottom:none}
.unit-stats .mini-spark{width:56px; height:20px; flex:none}

/* ===== 我的页 ===== */
.profile{display:flex; align-items:center; gap:12px; padding:18px 16px; background:var(--surface); border-bottom:1px solid var(--line-2);}
.avatar{width:52px; height:52px; border-radius:16px; background:linear-gradient(135deg,#1D4E89,#2C6BB5); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; flex:none;}
.profile .p-name{font-size:16px; font-weight:800}
.profile .p-sub{font-size:12px; color:var(--ink2); margin-top:2px}
.menu-group{margin:14px 16px 0;}
.menu-item{display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--surface); border:1px solid var(--line); cursor:pointer;}
.menu-item:first-child{border-radius:var(--radius) var(--radius) 0 0}
.menu-item:last-child{border-radius:0 0 var(--radius) var(--radius)}
.menu-item + .menu-item{border-top:none}
.menu-item.solo{border-radius:var(--radius); border-top:1px solid var(--line)}
.menu-item:active{background:var(--bg)}
.menu-item .m-ico{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
.menu-item .m-ico svg{width:17px; height:17px}
.menu-item .m-t{flex:1; font-size:14px; font-weight:600}
.menu-item .m-d{font-size:12px; color:var(--ink3)}
.menu-item .m-arrow{color:var(--ink3)}
.word-item{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin:0 16px 8px;}
.word-item .w-main{flex:1; min-width:0}
.word-item .w-word{font-size:14.5px; font-weight:800}
.word-item .w-meaning{font-size:12px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.word-item .w-meta{font-size:11px; color:var(--ink3); margin-top:1px}
.word-item .w-act{flex:none}
.setting-row{display:flex; align-items:center; gap:10px; padding:13px 16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin:0 16px 8px; font-size:14px;}
.setting-row .s-t{flex:1; font-weight:600}
.setting-row .s-d{font-size:11.5px; color:var(--ink3); display:block; margin-top:1px}
.seg{display:flex; background:var(--bg); border-radius:9px; padding:3px; flex:none;}
.seg button{border:none; background:none; font-family:inherit; font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:7px; color:var(--ink2); cursor:pointer;}
.seg button.on{background:var(--surface); color:var(--primary); box-shadow:var(--shadow)}
.switch{width:42px; height:24px; border-radius:999px; background:#C9D2DF; border:none; cursor:pointer; position:relative; flex:none; transition:background .2s;}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--correct)}
.switch.on::after{left:20px}
.switch.amber.on{background:var(--accent)}
.about{padding:16px; font-size:12px; color:var(--ink3); line-height:1.7; text-align:center;}

/* ===== Toast ===== */
#toast{
  position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(8px); z-index:99;
  background:rgba(23,35,61,.92); color:#fff; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:86%; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone" id="app">
  <!-- ===== 视图：今日 ===== -->
  <div class="view active" id="view-today"></div>
  <!-- ===== 视图：题库 ===== -->
  <div class="view" id="view-bank"></div>
  <!-- ===== 视图：考试 ===== -->
  <div class="view" id="view-exam"></div>
  <!-- ===== 视图：统计 ===== -->
  <div class="view" id="view-stats"></div>
  <!-- ===== 视图：我的 ===== -->
  <div class="view" id="view-mine"></div>

  <!-- ===== 覆盖：学习 ===== -->
  <div class="overlay" id="overlay-learn">
    <div class="learn-head">
      <div class="row"><button class="icon-btn" id="learn-back" aria-label="返回"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><span class="title" id="learn-title">学习</span></div>
      <div class="learn-prog">
        <span class="faint" style="font-size:11px;" id="learn-pos">0/0</span>
        <div class="prog-track"><i id="learn-progbar" style="width:0%"></i></div>
        <span class="learn-timer" id="learn-timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="learn-timer-txt">00:00</span></span>
      </div>
    </div>
    <div class="learn-body" id="learn-body"></div>
    <div class="learn-foot">
      <button class="btn btn-ghost" id="learn-collect"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18.3 6.2 21l1.1-6.5L2.6 9.8l6.5-.9z"/></svg><span id="collect-txt">收藏</span></button>
      <button class="btn btn-primary" id="learn-submit">提交</button>
      <button class="btn btn-ghost" id="learn-next" disabled>下一题</button>
    </div>
  </div>

  <!-- ===== 覆盖：考试作答 ===== -->
  <div class="overlay" id="overlay-exam">
    <div class="topbar" style="background:var(--surface); border-bottom:1px solid var(--line-2);">
      <button class="icon-btn" id="exam-back" aria-label="返回"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="title" id="exam-title">考试</div>
      <div class="exam-timer" id="exam-timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="exam-timer-txt">15:00</span></div>
      <button class="icon-btn" id="exam-sheetbtn" aria-label="答题卡"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
    </div>
    <div class="learn-body" id="exam-body"></div>
    <div class="learn-foot">
      <button class="btn btn-ghost" id="exam-prev">上一题</button>
      <button class="btn btn-primary" id="exam-next">下一题</button>
      <button class="btn btn-danger" id="exam-submit">交卷</button>
    </div>
    <!-- 答题卡抽屉 -->
    <div class="answer-sheet" id="answer-sheet">
      <div class="topbar" style="background:var(--surface); border-bottom:1px solid var(--line-2);">
        <button class="icon-btn" id="as-close" aria-label="收起"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        <div class="title" id="as-title">答题卡</div>
        <span class="chip" id="as-count"></span>
      </div>
      <div style="padding:6px 16px 4px; font-size:12.5px; color:var(--ink2);" id="as-legend">点击题号跳转</div>
      <div class="as-grid" id="as-grid"></div>
      <div style="padding:0 16px 16px;"><button class="btn btn-primary btn-block" id="as-submit">交卷</button></div>
    </div>
  </div>

  <!-- ===== 覆盖：成绩单 ===== -->
  <div class="overlay" id="overlay-result">
    <div class="topbar" style="background:var(--bg);">
      <button class="icon-btn" id="result-back" aria-label="返回"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="title">成绩单</div>
    </div>
    <div id="result-body"></div>
  </div>

  <!-- ===== 查词弹层 ===== -->
  <div id="word-mask"><div id="word-sheet"></div></div>

  <!-- ===== 底部 Tab ===== -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v16H4z" opacity=".4"/><path d="M4 5h16v16H4z" opacity=".4"/><path d="M9 3v4M15 3v4M4 11h16"/><path d="M8 15l2.5 2.5L16 13"/></svg>今日</button>
    <button class="tab" data-tab="bank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V4a2 2 0 00-2-2H6.5A2.5 2.5 0 004 4.5z"/><path d="M4 19.5A2.5 2.5 0 006.5 22H20v-5"/><path d="M9 8h6M9 12h6"/></svg>题库</button>
    <button class="tab" data-tab="exam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>考试</button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v-4M12 15V7M17 15v-7"/></svg>统计</button>
    <button class="tab" data-tab="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>我的</button>
  </nav>

  <div id="toast"></div>
</div>

<script src="data/dict.js"></script>
<script src="data/sample-papers.js"></script>
<script>
window.CET6_SAMPLE_PAPERS = window.PAPERS_DATA;
window.PAPERS_DATA = null;
window.CET6_HAS_REAL_PAPERS = false;
</script>
<script src="data/papers.js"></script>
<script>
if(window.PAPERS_DATA && PAPERS_DATA.length){
  window.CET6_HAS_REAL_PAPERS = true;
} else {
  window.PAPERS_DATA = window.CET6_SAMPLE_PAPERS;
  window.CET6_HAS_REAL_PAPERS = false;
}
</script>
<script src="app.js"></script>
</body>
</html>
